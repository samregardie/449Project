CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y

# Hardware floats for the PID; sharing so any thread may use them safely
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# UART
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# main only does init and test prints: keep it below every app thread (1-3)
CONFIG_MAIN_THREAD_PRIORITY=10
