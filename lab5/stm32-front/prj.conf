CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_CAN=y
CONFIG_CRC=y
CONFIG_WATCHDOG=y

# Debug: print the reset cause at boot (was it the watchdog?)
CONFIG_HWINFO=y

# main does init, then FORCE_TX: the lowest priority, below every other thread
CONFIG_MAIN_THREAD_PRIORITY=10

# One MCP2515 filter per received CAN ID (canbus.c MAX_HANDLERS)
CONFIG_CAN_MCP2515_MAX_FILTERS=24

# 1 us ticks: clock_settime/gettime count in ticks, and 100 us (the default) is too coarse for sync
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000000
